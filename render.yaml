# Blueprint de Render: "New > Blueprint" y elige este repositorio
services:
  - type: web
    name: juegos-tradicionales
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false   # lo pegas tú en el panel de Render
